name: kv-tv

services:
  kv-tv-interface:
    build:
      context: .
      dockerfile: Dockerfile.interface
    image: vndangkhoa/kv-tv-interface:latest
    container_name: kv-tv-interface
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - BACKEND_URL=http://kv-tv-backend:3457
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      - kv-tv-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  kv-tv-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vndangkhoa/kv-tv-backend:latest
    container_name: kv-tv-backend
    restart: unless-stopped
    ports:
      - "3457:3457"
    environment:
      - NODE_ENV=production
      - PORT=3457
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://tv.vndns.net}
      - FORGEJO_TOKEN=${FORGEJO_TOKEN:-}
      - ADMIN_DEFAULT_USER=${ADMIN_DEFAULT_USER:-vndangkhoa}
      - ADMIN_DEFAULT_PASS=${ADMIN_DEFAULT_PASS:-thieugia}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # =========================================================================
      # PERSISTENT HOST BIND-MOUNTS (ZERO-REBUILD APK & CATALOG UPDATES)
      # =========================================================================
      # Because ./data (catalog JSON, analytics telemetry, TOTP 2FA config, ads)
      # and ./uploads (.apk binaries and .zip pre-set config packs) live directly
      # on your VPS host disk via bind mounts:
      #   1. Uploading or deleting .apk files in https://tv.vndns.net/admin saves
      #      instantly to ./uploads on the host WITHOUT rebuilding Docker.
      #   2. Editing app versions, short-codes, or ads saves to ./data/store.json
      #      and survives container restarts, updates, and `docker system prune`.
      - ./data:/app/data
      - ./uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3457/api/catalog?track=0').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
